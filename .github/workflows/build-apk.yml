name: Build APK - FINAL FIX
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          rm -rf node_modules package-lock.json android
          npm install

      - name: PATCH all expo modules - fix Publication.version
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const glob = require('fs');
          function walk(dir){
            if(!fs.existsSync(dir)) return;
            const files = fs.readdirSync(dir);
            for(const f of files){
              const full = path.join(dir,f);
              try{
                const stat = fs.statSync(full);
                if(stat.isDirectory()){
                  if(f==='expo-module.config.json'){
                    const content = fs.readFileSync(full,'utf8');
                    let json = JSON.parse(content);
                    let changed=false;
                    if(json.android && json.android.projects){
                      for(const p of json.android.projects){
                        if(p.publication && !p.publication.version){
                          p.publication.version="1.0.0";
                          changed=true;
                        }
                      }
                    }
                    if(json.android && json.android.publication && !json.android.publication.version){
                      json.android.publication.version="1.0.0";
                      changed=true;
                    }
                    if(changed){
                      fs.writeFileSync(full, JSON.stringify(json,null,2));
                      console.log("PATCHED "+full);
                    }
                  }
                  walk(full);
                }
              }catch(e){}
            }
          }
          walk('node_modules');
          console.log("PATCH DONE");
          EOF

      - name: Prebuild
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lisungi-apk-final
          path: android/app/build/outputs/apk/release/app-release.apk
