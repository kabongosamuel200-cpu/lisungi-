name: Build APK - Expo SDK 51 Stable
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          npm install
          npx expo install expo@~51.0.28 -- --save
          npx expo install --fix
      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: Force Gradle 8.8 for SDK 51
        run: |
          sed -i 's|distributionUrl.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.8-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lisungi-apk-sdk51
          path: android/app/build/outputs/apk/release/app-release.apk
