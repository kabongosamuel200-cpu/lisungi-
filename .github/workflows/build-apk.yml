name: Build APK - FIX SDK54
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install CORRECT dependencies for SDK 54
        run: |
          rm -rf node_modules package-lock.json android
          npm install react-native-paper@^5.14.5 --save
          npm install
          npx expo install --fix

      - name: Patch the bug Publication.version (real file)
        run: |
          echo "Searching for Publication.kt..."
          FILE=$(find node_modules/expo-modules-autolinking -type f -name "*.kt" | xargs grep -l "class Publication" | head -n 1)
          echo "Found: $FILE"
          if [ -f "$FILE" ]; then
            sed -i 's/val version: String/val version: String = "1.0.0"/g' "$FILE"
            sed -i 's/var version: String/var version: String = "1.0.0"/g' "$FILE"
            cat "$FILE"
          else
            echo "Patching all kt files..."
            find node_modules/expo-modules-autolinking -name "*.kt" -exec sed -i 's/val version: String/val version: String = "1.0.0"/g' {} \;
          fi
          # second safety: inject version in all expo-module.config.json
          find node_modules -name "expo-module.config.json" -exec sh -c 'grep -q "\"publication\"" "$1" && sed -i "s/\"publication\": {/\"publication\": { \"version\": \"1.0.0\", /g" "$1" || true' _ {} \;

      - name: Prebuild
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lisungi-apk-sdk54-fixed
          path: android/app/build/outputs/apk/release/app-release.apk
