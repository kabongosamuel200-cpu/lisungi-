name: Build APK with EAS
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm install
      - run: npm install -g eas-cli
      - name: Create eas.json if missing
        run: |
          if [ ! -f eas.json ]; then
            echo '{"cli":{"version":">= 5.9.0"},"build":{"preview":{"distribution":"internal","android":{"buildType":"apk"}},"production":{}}}' > eas.json
            cat eas.json
          fi
      - run: npx expo prebuild --platform android --non-interactive --clean || true
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: lisungi-apk
          path: android/app/build/outputs/apk/release/app-release.apk
